name: Documentación

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "src/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      # Construye el sitio y lo deja en la rama gh-pages, que sirve GitHub Pages
      - run: mkdocs gh-deploy --force --strict
